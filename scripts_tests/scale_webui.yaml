# WebUI x2 (webui + webui2) behind an nginx load balancer on port 8080
services:
  registry:
    image: descartesresearch/teastore-registry
    expose: ["8080"]
  db:
    image: descartesresearch/teastore-db
    expose: ["3306"]
  persistence:
    image: descartesresearch/teastore-persistence
    expose: ["8080"]
    environment: {HOST_NAME: "persistence", REGISTRY_HOST: "registry", DB_HOST: "db", DB_PORT: "3306"}
  auth:
    image: descartesresearch/teastore-auth
    expose: ["8080"]
    environment: {HOST_NAME: "auth", REGISTRY_HOST: "registry"}
  image:
    image: descartesresearch/teastore-image
    expose: ["8080"]
    environment: {HOST_NAME: "image", REGISTRY_HOST: "registry"}
  recommender:
    image: descartesresearch/teastore-recommender
    expose: ["8080"]
    environment: {HOST_NAME: "recommender", REGISTRY_HOST: "registry"}
  webui:
    image: descartesresearch/teastore-webui
    expose: ["8080"]
    environment: {HOST_NAME: "webui", REGISTRY_HOST: "registry"}
  webui2:
    image: descartesresearch/teastore-webui
    expose: ["8080"]
    environment: {HOST_NAME: "webui2", REGISTRY_HOST: "registry"}
  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx_webui2.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [webui, webui2]
